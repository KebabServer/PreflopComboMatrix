<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flop Viewer</title>
    <style>
        body {
            background-color: #0f172a;
        }

        #header-container {
            width: 100%;
        }

        .app-container {
            margin: 0 auto;
            max-width: 550px;
            padding: 5px;
        }

        .tooltip {
            visibility: hidden;
            white-space: nowrap;
            background-color: #363434;
            color: #000000;
            text-align: left;
            position: absolute;
            z-index: 10;
            width: 50%;
        }

        .tooltipTable {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        .tooltipHandDiv {
            display: flex;
            border: 2px solid black;
            border-collapse: collapse;
            padding: 2px;
            font-size: small;
            width: 100%;
            height: 5vh;
        }

        .tooltipHandBackground {
            text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff,
                1px 1px #fff, -1px -1px #fff, 1px -1px #fff, -1px 1px #fff;
        }

        .tooltipbetsize {
            color: #000000;
            font-size: 10px;
            padding: 0;
            height: 1em;
        }

        .tooltipdivider {
            flex: 50%;
        }

        .matrixSingleHandDiv {
            box-sizing: border-box;
            display: inline-block;
            height: 4vh;
            width: 100%;
            font-size: small;
            font-weight: bold;
            color: black;
            text-align: center;
            outline: 1px solid black;
            padding: 0;
        }

        .hand_matrix_div {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            grid-template-rows: repeat(13, 1fr);
            width: 100%;
        }

        .topDiv {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
        }

        .betsize-total, .preflop-total {
            color: black;
            outline: 2px solid black;
            text-align: center;
            font-weight: bold;
        }

        .preflop-total {
            background-color: white;
            grid-column: 11 / 13;
        }

        .matrixboard-card {
            border: 2px solid #8a8a8a;
            border-radius: 5px;
            text-align: center;
            background-color: white;
            vertical-align: middle;
        }

        .matrixboard-card::before {
            content: attr(data-rank);
            font-size: 30px;
        }

        .matrixboard-card[data-suit="x"],
        .matrixboard-card[data-suit="♠"] { color: black; }
        .matrixboard-card[data-suit="x"] { font-weight: bold; }
        .matrixboard-card[data-suit="♣"] { color: rgb(0, 148, 7); }
        .matrixboard-card[data-suit="♥"] { color: red; }
        .matrixboard-card[data-suit="♦"] { color: rgb(0, 3, 204); }

        .range-switch-div {
            border-radius: 5px;
            text-align: center;
            background-color: gray;
            padding: 10px 0;
            color: black;
            font-weight: bold;
            border: 2px solid white;
            cursor: pointer;
        }

        .hand-classes-div {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: repeat(13, 1fr);
            width: 100%;
        }

        .range-div {
            display: none;
        }

        .hand-class-div {
            text-align: center;
            color: black;
            font-weight: bold;
            font-size: 0.8rem;
            border: 1px solid black;
        }

        #spot-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .dropdown-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 220px;
            flex: 1;
        }

        .dropdown-label {
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .spot-dropdown {
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        .spot-dropdown option {
            background-color: #0f172a;
            color: white;
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="app-container">
        <div id="range-viewer"></div>
        <div id="spot-btns"></div>
    </div>

    <script>
        // Load Header
        fetch('header.html')
            .then(res => res.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; });

        // App Constants & Configuration
        const CONFIG = {
            columns: {
                configuration: 'Configuration',
                board: 'Board',
                nodeNamePrefix: 'NodeName',
                preflopRangePrefix: 'PreflopRange',
                rangeColorsPrefix: 'RangeColors',
                freqsPrefix: 'Freqs'
            }
        };

        const cards = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
        const suits = ['s', 'h', 'd', 'c'];
        const madeHandClasses = ["Straightflush", "Quads", "Fullhouse", "Flush", "Straight", "Set", "Trips", "Two Pair", "Over Pair", "Top Pair", "Mid Pair", "Bottom Pair", "Under Pair", "Ace High", "King High", "No Made Hand"];
        const drawingHandClasses = ["Combo Draw", "Nut Flush Draw", "Pair And Flush Draw", "Flush Draw", "OESD", "Gutshot", "Ax BDFD 2 Cards", "BDFD 2 Cards", "Ax BDFD 1 Card", "BDFD 1 Card", "No Pair No Draw", "No Draw"];

        const SUIT_MAP = {
            s: { symbol: '♠', color: 'black' },
            h: { symbol: '♥', color: 'red' },
            c: { symbol: '♣', color: 'rgb(0, 148, 7)' },
            d: { symbol: '♦', color: 'rgb(0, 3, 204)' },
            x: { symbol: 'x', color: 'black' }
        };

        // Generate 1326 combo strings and coordinate mappings dynamically
        const cardOrder = [];
        const deck = [];
        '23456789TJQKA'.split('').forEach(r => 'cdhs'.split('').forEach(s => deck.push(r + s)));
        for (let i = 0; i < 52; i++) {
            for (let j = 0; j < i; j++) {
                cardOrder.push(deck[i] + deck[j]);
            }
        }
        const cardOrderX = cardOrder.map(hand => cards.indexOf(hand[0]));
        const cardOrderY = cardOrder.map(hand => cards.indexOf(hand[2]));

        // Heights matrix (Pairs = 6, Offsuit = 12, Suited = 4)
        const heightsMax = Array.from({ length: 13 }, (_, x) =>
            Array.from({ length: 13 }, (_, y) => x === y ? 6 : (x > y ? 12 : 4))
        );

        let rows, headers;

        // Fetch Data
        (function fetchTSVFile() {
            fetch('FlopViewer/FlopViewer.tsv')
                .then(res => {
                    if (!res.ok) throw new Error('Network error');
                    return res.text();
                })
                .then(data => {
                    rows = data.trim().split('\n').map(row => row.split('\t'));
                    headers = rows[0];
                    createSpotButtons();
                })
                .catch(err => console.error('TSV Fetch Error:', err));
        })();

        function createSpotButtons() {
            const container = document.getElementById('spot-btns');
            container.innerHTML = '';

            const groupIdx = headers.indexOf(CONFIG.columns.configuration);
            const titleIdx = groupIdx;
            const cardsIdx = headers.indexOf(CONFIG.columns.board);

            const groups = {};
            for (let i = 1; i < rows.length; i++) {
                const groupKey = (groupIdx !== -1 && rows[i][groupIdx]) ? rows[i][groupIdx] : 'General';
                groups[groupKey] = groups[groupKey] || [];
                groups[groupKey].push({ rowIndex: i, rowData: rows[i] });
            }

            Object.keys(groups).forEach(groupName => {
                const wrapper = document.createElement('div');
                wrapper.className = 'dropdown-wrapper';

                const label = document.createElement('label');
                label.className = 'dropdown-label';
                label.textContent = groupName;

                const select = document.createElement('select');
                select.className = 'spot-dropdown';

                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = '-- Select Spot --';
                defaultOpt.disabled = true;
                defaultOpt.selected = true;
                select.appendChild(defaultOpt);

                groups[groupName].forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.rowIndex;
                    opt.textContent = item.rowData[cardsIdx];
                    select.appendChild(opt);
                });

                select.onchange = function () {
                    if (this.value) {
                        document.querySelectorAll('.spot-dropdown').forEach(s => {
                            if (s !== select) s.selectedIndex = 0;
                        });
                        loadRange(getMatrixData(this.value));
                    }
                };

                wrapper.appendChild(label);
                wrapper.appendChild(select);
                container.appendChild(wrapper);
            });
        }

        function getMatrixData(rowNumber) {
            const row = rows[rowNumber];
            const getVal = colName => row[headers.indexOf(colName)];
            const ranges = {};

            for (let i = 1; ; i++) {
                const nodeName = getVal(CONFIG.columns.nodeNamePrefix + i);
                if (!nodeName) break;
                ranges[nodeName] = {
                    preflop_range: getVal(CONFIG.columns.preflopRangePrefix + i),
                    range_colors: getVal(CONFIG.columns.rangeColorsPrefix + i),
                    range_freqs: getVal(CONFIG.columns.freqsPrefix + i)
                };
            }

            return {
                configuration: getVal(CONFIG.columns.configuration),
                board: getVal(CONFIG.columns.board),
                ranges
            };
        }

        function formatCardSpan(rank, suitChar) {
            const s =

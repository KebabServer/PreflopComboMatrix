<style>
    /* Reset general site margins */
    body {
        margin: 0;
        padding: 0;
    }

    /* Entire top bar style */
    .header {
        background-color: #2c3e50;
        padding: 15px 30px;
        width: 100%;
        box-sizing: border-box;
        margin: 0;
        display: flex;
        justify-content: center;
    }

    /* Layout for horizontal list */
    .header ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 20px;
    }

    /* Link styles */
    .header a {
        color: #ffffff;
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 16px;
        padding: 10px 15px;
        border-radius: 4px;
        transition: background-color 0.3s ease;
    }

    /* Hover effect */
    .header a:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    /* Active page button */
    .header a.active {
        background-color: #3498db;
        color: #ffffff;
    }
</style>

<nav class="header">
    <ul>
        <li><a href="index.html">Preflop</a></li>
        <li><a href="palvelut.html">Services</a></li>
        <li><a href="tietoa.html">About Us</a></li>
        <li><a href="yhteystiedot.html">Contact</a></li>
    </ul>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Luetaan nykyisen sivun polku (esim. /palvelut.html tai /)
        const currentPath = window.location.pathname.toLowerCase();
        const navLinks = document.querySelectorAll(".header a");

        navLinks.forEach(link => {
            const href = link.getAttribute("href").toLowerCase();
            console.log(href);

            // Poistetaan active-luokka varmuuden vuoksi aluksi
            link.classList.remove("active");

            // Tarkistetaan täsmääkö polun loppuosa linkkiin
            if (currentPath.endsWith(href)) {
                link.classList.add("active");
            } 
            // Etusivun erikoistapaukset (sivusto avattu juuresta "/" tai tyhjänä)
            else if (href === "index.html" && (currentPath === "/" || currentPath.endsWith("/index.html") || currentPath === "")) {
                link.classList.add("active");
            }
        });
    });
</script>

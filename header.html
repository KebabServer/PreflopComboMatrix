<style>
    /* Reset general site margins if not done elsewhere */
    body {
        margin: 0;
        padding: 0;
    }

    /* Entire top bar style - forces full width */
    .header {
        background-color: #2c3e50; /* Dark blue background color */
        padding: 15px 30px;
        width: 100%;
        box-sizing: border-box; /* Ensures padding doesn't increase width beyond 100% */
        margin: 0;
        display: flex;
        justify-content: center;
    }

    /* Layout for horizontal list */
    .header ul {
        list-style-type: none; /* Removes default list bullets */
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 20px; /* Space between links */
    }

    /* Link styles */
    .header a {
        color: #ffffff; /* White text color */
        text-decoration: none; /* Removes underline */
        font-family: Arial, sans-serif;
        font-size: 16px;
        padding: 10px 15px;
        border-radius: 4px;
        transition: background-color 0.3s ease;
    }

    /* Hover effect */
    .header a:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    /* Active page button */
    .header a.active {
        background-color: #3498db; /* Brighter blue background */
        color: #ffffff;
    }
</style>

<nav class="header">
    <ul>
        <li><a href="index.html">Preflop</a></li>
        <li><a href="palvelut.html">Services</a></li>
        <li><a href="tietoa.html">About Us</a></li>
        <li><a href="yhteystiedot.html">Contact</a></li>
    </ul>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Haetaan koko nykyinen URL pienillä kirjaimilla vertailun helpottamiseksi
        const currentUrl = window.location.href.toLowerCase();
        const navLinks = document.querySelectorAll(".header a");

        navLinks.forEach(link => {
            const href = link.getAttribute("href").toLowerCase();
            
            // Tarkistetaanko täsmääkö URL suoraan linkin href-attribuuttiin (esim. palvelut.html)
            let isMatch = currentUrl.endsWith("/" + href) || currentUrl.endsWith(href);

            // Erikoistapaus etusivulle: jos osoite päättyy pelkkään kauttamerkkiin (/) tai kansioon, oletetaan se etusivuksi
            if (href === "index.html" && (currentUrl.endsWith("/") || currentUrl.endsWith("index.html"))) {
                isMatch = true;
            } else if (href === "index.html" && !currentUrl.includes(".html")) {
                isMatch = true;
            }

            if (isMatch) {
                link.classList.add("active");
            } else {
                link.classList.remove("active");
            }
        });
    });
</script>

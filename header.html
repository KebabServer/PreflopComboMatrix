<style>
    /* Reset general site margins if not done elsewhere */
    body {
        margin: 0;
        padding: 0;
    }

    /* Entire top bar style - forces full width */
    .header {
        background-color: #2c3e50; /* Dark blue background color */
        padding: 15px 30px;
        width: 100%;
        box-sizing: border-box; /* Ensures padding doesn't increase width beyond 100% */
        margin: 0;
        display: flex;
        justify-content: center;
    }

    /* Layout for horizontal list */
    .header ul {
        list-style-type: none; /* Removes default list bullets */
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 20px; /* Space between links */
    }

    /* Link styles */
    .header a {
        color: #ffffff; /* White text color */
        text-decoration: none; /* Removes underline */
        font-family: Arial, sans-serif;
        font-size: 16px;
        padding: 10px 15px;
        border-radius: 4px;
        transition: background-color 0.3s ease;
    }

    /* Hover effect */
    .header a:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }

    /* Active page button */
    .header a.active {
        background-color: #3498db; /* Brighter blue background */
        color: #ffffff;
    }
</style>

<nav class="header">
    <ul>
        <li><a href="index.html">Preflop</a></li>
        <li><a href="palvelut.html">Services</a></li>
        <li><a href="tietoa.html">About Us</a></li>
        <li><a href="yhteystiedot.html">Contact</a></li>
    </ul>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const currentPath = window.location.pathname;

        const navLinks = document.querySelectorAll(".header a");

        // Apufunktio polkujen yhdenmukaistamiseen (käsittelee juuriosoitteet ja index.html:n oikein)
        const normalizePath = (path) => {
            let p = path.endsWith('/') ? path + 'index.html' : path;
            if (p === '' || p === '/') {
                return '/index.html';
            }
            // Varmistetaan, että päättyy index.html:ään jos kyseessä on hakemisto ilman tiedostonimeä
            if (!p.endsWith('.html') && !p.endsWith('.htm')) {
                p = p.endsWith('/') ? p + 'index.html' : p + '/index.html';
            }
            return p;
        };

        navLinks.forEach(link => {
            // Haetaan linkin absoluuttinen polku
            const linkPath = new URL(link.getAttribute("href"), window.location.origin).pathname;

            // Verrataan normalisoituja polkuja toisiinsa (ottaen huomioon tiedostonimen tai päätteen)
            const normalizedCurrent = currentPath.split('/').pop() || 'index.html';
            const normalizedLink = link.getAttribute("href");

            if (normalizedCurrent === normalizedLink) {
                link.classList.add("active");
            } else {
                link.classList.remove("active");
            }
        });
    });
</script>

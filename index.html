<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Combo Matrix</title>
    <style>
        :root {
            --raise-color: rgb(231, 153, 123);
            --call-color: rgb(143, 191, 139);
            --fold-color: rgb(111, 161, 193);
            --clear-color: rgb(102, 102, 102);
            --allin-color: rgb(251, 73, 43);
            --bg-color: #f0f0f0;
            --bg-sidebar: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: flex-start;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            user-select: none;
            min-height: 100vh;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: var(--bg-sidebar);
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid #ddd;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .sidebar-section {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: bold;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .preset-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #fdfdfd;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.15s ease;
        }

        .preset-btn:hover {
            background: #eef4ff;
            border-color: #007bff;
            color: #007bff;
        }

        .preset-btn.active {
            border-color: #007bff;
            background: #007bff;
            color: #fff;
        }

        .main-content {
            padding: 15px;
            flex-grow: 1;
        }

        .palette-panel {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 950px;
        }

        .palette-btn {
            height: 30px;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            background: white;
        }

        .palette-btn.active {
            outline: 3px solid #007bff;
            z-index: 10;
        }

        .main-container {
            display: flex;
            gap: 15px;
            max-width: 950px;
            width: 100%;
        }

        .matrix-panel {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background: #444;
            border: 2px solid #222;
        }

        .matrix-cell {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }

        .detail-panel {
            width: 300px;
            background: #fff;
            border: 1px solid #999;
            padding: 12px;
            height: 585px;
            overflow-y: auto;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .bulk-section {
            background: #f9f9f9;
            padding: 8px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .bulk-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #666;
            text-transform: uppercase;
        }

        .combo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 13px;
        }

        .combo-actions {
            display: flex;
            gap: 3px;
        }

        .action-dot {
            width: 18px;
            height: 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-radius: 3px;
        }

        .action-dot.active {
            outline: 2px solid #000;
            outline-offset: 1px;
        }

        .suit-s {
            color: #000;
        }

        .suit-c {
            color: #1a7a1a;
        }

        .suit-h {
            color: #d10000;
        }

        .suit-d {
            color: #0051ff;
        }

        .bottom-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 100%;
            max-width: 950px;
            gap: 8px;
            margin-top: 15px;
        }

        .stat-box {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #333;
            cursor: pointer;
            color: black;
        }

        .tooltip {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #333;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>

        function init() {

        function createSidebarPresets() {
            const container = document.getElementById('sidebarContent');
            container.innerHTML = '';

            const categories = {};
            PRESETS.forEach(p => {
                const cat = p.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(p);
            });

            Object.entries(categories).forEach(([catName, presets]) => {
                const section = document.createElement('div');
                section.className = 'sidebar-section';

                const title = document.createElement('div');
                title.className = 'sidebar-section-title';
                title.innerText = catName;
                section.appendChild(title);

                presets.forEach(preset => {
                    const btn = document.createElement('button');
                    btn.className = 'preset-btn';

                    const raisePct = getRaisePercentage(preset);
                    btn.innerHTML = `<span>${preset.name}</span> <span class="preset-tag">(${raisePct})</span>`;
                    btn.onclick = () => {
                        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        applyPreset(preset);
                    };
                    section.appendChild(btn);
                });

                container.appendChild(section);
            });
        }

        function getRaisePercentage(preset) {
            const raiseActions = preset.actions[COLORS.RAISE];
            if (!raiseActions) return '0.0%';

            const handList = (Array.isArray(raiseActions) ? raiseActions : [raiseActions])
                .flatMap(item => typeof item === 'string' ? item.split(',') : item)
                .map(h => h.trim())
                .filter(Boolean);

            const uniqueHands = new Set(handList);
            let comboCount = 0;

            uniqueHands.forEach(hand => {
                if (hand.length === 4) {
                    comboCount += 1;
                } else if (hand.length === 2) {
                    comboCount += 6;
                } else if (hand.length === 3) {
                    if (hand.endsWith('s')) comboCount += 4;
                    if (hand.endsWith('o')) comboCount += 12;
                }
            });

            return `${((comboCount / 1326) * 100).toFixed(1)}%`;
        }

        function applyPreset(preset) {
            gridState.forEach(state => {
                Object.keys(state.handMap).forEach(combo => {
                    state.handMap[combo] = COLORS.CLEAR;
                });
            });

            const comboToState = {};
            const labelToState = {};
            gridState.forEach(s => {
                labelToState[s.label] = s;
                Object.keys(s.handMap).forEach(k => comboToState[k] = s);
            });

            Object.entries(preset.actions).forEach(([color, hands]) => {
                if (!hands) return;

                const handList = (Array.isArray(hands) ? hands : [hands])
                    .flatMap(item => typeof item === 'string' ? item.split(',') : item)
                    .map(h => h.trim())
                    .filter(Boolean);

                handList.forEach(hand => {
                    if (hand.length === 4) {
                        const cellState = comboToState[hand];
                        if (cellState) {
                            cellState.handMap[hand] = color;
                        }
                    } else {
                        const cellState = labelToState[hand];
                        if (cellState) {
                            Object.keys(cellState.handMap).forEach(combo => {
                                cellState.handMap[combo] = color;
                            });
                        }
                    }
                });
            });

            gridState.forEach(state => updateCellVisual(state));
            updateStats();

            if (selectedCell) {
                selectCell(selectedCell);
            }
        }

        function createPalette() {
            const container = document.getElementById('palettePanel');
            PALETTES.forEach((p, i) => {
                const btn = document.createElement('div');
                btn.className = 'palette-btn' + (i === 0 ? ' active' : '');
                btn.innerText = p.n;

                if (!p.c) {
                    btn.style.background = '#fff';
                } else if (p.c.length === 1) {
                    btn.style.background = p.c[0];
                } else {
                    const stops = [];
                    const step = 100 / p.c.length;

                    p.c.forEach((color, index) => {
                        const start = index * step;
                        const end = (index + 1) * step;
                        stops.push(`${color} ${start}%`, `${color} ${end}%`);
                    });

                    btn.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
                }

                btn.onclick = () => {
                    currentBrush = p.c;
                    document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                container.appendChild(btn);
            });
        }

        function createMatrix() {
            const container = document.getElementById('matrixPanel');
            for (let r = 0; r < 13; r++) {
                for (let c = 0; c < 13; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    const label = (r < c) ? cards[r] + cards[c] + 's' : (r > c ? cards[c] + cards[r] + 'o' : cards[r] + cards[r]);
                    cell.innerText = label;
                    const state = {label, handMap: generateHandMap(r, c), dom: cell};
                    cell.onmousedown = () => {isDragging = true; paintCell(state); selectCell(state);};
                    cell.onmouseenter = () => {if (isDragging) paintCell(state);};
                    updateCellVisual(state);
                    container.appendChild(cell);
                    gridState.push(state);
                }
            }
        }

        function generateHandMap(r, c) {
            const map = {};
            const r1 = cards[r], r2 = cards[c];
            if (r === c) {
                for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) map[`${r1}${suits[i]}${r2}${suits[j]}`] = COLORS.CLEAR;
            } else if (c > r) {
                suits.forEach(s => map[`${r1}${s}${r2}${s}`] = COLORS.CLEAR);
            } else {
                suits.forEach(s1 => suits.forEach(s2 => {if (s1 !== s2) map[`${r2}${s1}${r1}${s2}`] = COLORS.CLEAR;}));
            }
            return map;
        }

        function paintCell(state) {
            if (!currentBrush) return;

            const keys = Object.keys(state.handMap);
            keys.forEach((k, i) => {
                state.handMap[k] = currentBrush[Math.floor((i / keys.length) * currentBrush.length)];
            });
            updateCellVisual(state);
            updateStats();
            if (selectedCell === state) selectCell(state);
        }

        function updateCellVisual(state) {
            const hideFold = document.getElementById('hideFoldCheckbox')?.checked;
            const vals = Object.values(state.handMap);
            let stops = vals.map((c, i) => {
                const renderColor = (hideFold && c === COLORS.FOLD) ? COLORS.CLEAR : c;
                return `${renderColor} ${(i / vals.length) * 100}% ${((i + 1) / vals.length) * 100}%`;
            });
            state.dom.style.background = `linear-gradient(to right, ${stops.join(',')})`;
        }

        function formatSuit(hand) {
            const symbol = {s: '♠', c: '♣', h: '♥', d: '♦'};
            return hand.replace(/([schd])/g, (m) => `<span class="suit-${m}">${symbol[m]}</span>`);
        }

        function selectCell(state) {
            selectedCell = state;
            document.getElementById('detailTitle').innerText = state.label;
            const bulk = document.getElementById('bulkContainer');
            bulk.innerHTML = '<div class="bulk-title">Bulk Apply</div>';
            const bulkActions = document.createElement('div');
            bulkActions.className = 'combo-actions';
            [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN, COLORS.CLEAR].forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'action-dot';
                btn.style.backgroundColor = color;
                btn.onclick = () => {
                    Object.keys(state.handMap).forEach(k => state.handMap[k] = color);
                    updateCellVisual(state); updateStats(); selectCell(state);
                };
                bulkActions.appendChild(btn);
            });
            bulk.appendChild(bulkActions);

            const container = document.getElementById('comboContainer');
            container.innerHTML = '';
            Object.entries(state.handMap).forEach(([name, curColor]) => {
                const row = document.createElement('div');
                row.className = 'combo-row';
                row.style.background = curColor;
                row.style.borderRadius = '4px';
                row.style.marginBottom = '2px';
                row.style.color = '#fff';
                row.style.textShadow = '1px 1px 1px #000';
                row.innerHTML = `<span style="font-weight:bold; padding-left:5px;">${formatSuit(name)}</span>`;
                const actionGroup = document.createElement('div');
                actionGroup.className = 'combo-actions';
                actionGroup.style.paddingRight = '5px';
                [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN, COLORS.CLEAR].forEach(color => {
                    const dot = document.createElement('div');
                    dot.className = `action-dot ${curColor === color ? 'active' : ''}`;
                    dot.style.backgroundColor = color;
                    dot.onclick = () => {
                        state.handMap[name] = color;
                        updateCellVisual(state); updateStats(); selectCell(state);
                    };
                    actionGroup.appendChild(dot);
                });
                row.appendChild(actionGroup);
                container.appendChild(row);
            });
        }

        function updateAllVisuals() {
            gridState.forEach(state => updateCellVisual(state));
        }

        function updateStats() {
            const counts = {[COLORS.RAISE]: 0, [COLORS.CALL]: 0, [COLORS.FOLD]: 0, [COLORS.ALLIN]: 0};
            gridState.forEach(s => Object.values(s.handMap).forEach(v => {if (counts[v] !== undefined) counts[v]++;}));
            const set = (id, color, name) => {
                const el = document.getElementById(id);
                el.style.backgroundColor = color;
                el.innerText = `${name}: ${((counts[color] / 1326) * 100).toFixed(1)}%` + '(' + counts[color].toFixed(1) + ')';
            };
            set('raiseStat', COLORS.RAISE, 'Raise');
            set('callStat', COLORS.CALL, 'Call');
            set('foldStat', COLORS.FOLD, 'Fold');
            set('allinStat', COLORS.ALLIN, 'All-In');
        }

        function copyAction(color, name) {
            const isGlobal = document.getElementById('convertToGlobalCheckbox')?.checked;
            let handWeights = [];

            gridState.forEach(state => {
                const combos = Object.entries(state.handMap);
                const matchingCombos = combos.filter(([_, v]) => v === color);

                if (matchingCombos.length > 0) {
                    if (isGlobal) {
                        // Simplified hand format with global frequency weight (e.g. AKs:0.25)
                        const weight = (matchingCombos.length / combos.length).toFixed(2);
                        handWeights.push(`${state.label}:${weight}`);
                    } else {
                        // Specific combo format weighted at 100% (e.g. AsKs:1)
                        matchingCombos.forEach(([combo]) => {
                            handWeights.push(`${combo}:1`);
                        });
                    }
                }
            });

            const copyText = handWeights.join(',') || 'None';

            navigator.clipboard.writeText(copyText);
            const t = document.getElementById('toast');
            t.innerText = `Copied ${name}`; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 1000);
        }

        init();
    </script>
</body>

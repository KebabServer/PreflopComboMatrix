<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimoitu Välilehtisivusto</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f8f9fa; color: #333; }
        
        /* Siisti, matalampi yläpalkki */
        header { background: #ffffff; border-bottom: 1px solid #e1e4e8; padding: 0 20px; display: flex; align-items: center; height: 50px; position: sticky; top: 0; z-index: 10; }
        nav { display: flex; gap: 5px; }
        
        /* Pienemmät ja kevyemmät napit */
        nav button { background: none; border: none; color: #586069; padding: 6px 14px; font-size: 14px; cursor: pointer; border-radius: 4px; font-weight: 500; transition: background 0.2s, color 0.2s; }
        nav button:hover { background: #f1f3f5; color: #24292e; }
        nav button.active { background: #e2e8f0; color: #0366d6; font-weight: 600; }

        /* Sisältöalue */
        main { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 6px; border: 1px solid #e1e4e8; }
    </style>
</head>
<body>

    <header>
        <nav>
            <button class="tab-btn active" onclick="loadSubPage('Preflop.html', this)">Preflop</button>
        </nav>
    </header>

    <main id="sisalto-alue">
        <h2>Tervetuloa</h2>
        <p>Tämä on etusivun oletussisältö.</p>
    </main>

    <script>
        async function loadSubPage(sivu, nappi) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            nappi.classList.add('active');

            const alue = document.getElementById('sisalto-alue');

            if (sivu === 'etusivu') {
                alue.innerHTML = `<h2>Tervetuloa</h2><p>Tämä on etusivun oletussisältö.</p>`;
                return;
            }

            try {
                const vastaus = await fetch(sivu);
                if (!vastaus.ok) throw new Error();
                const htmlTeksti = await vastaus.text();
                
                // 1. Asetetaan HTML sivuun
                alue.innerHTML = htmlTeksti;

                // 2. Etsitään ja suoritetaan mahdolliset skriptit ladatusta sisällöstä
                const skriptit = alue.querySelectorAll('script');
                skriptit.forEach(vanhaSkripti => {
                    const uusiSkripti = document.createElement('script');
                    
                    // Kopioidaan mahdolliset attribuutit (esim. src)
                    Array.from(vanhaSkripti.attributes).forEach(attr => {
                        uusiSkripti.setAttribute(attr.name, attr.value);
                    });
                    
                    // Kopioidaan skriptin sisällä oleva koodi
                    uusiSkripti.appendChild(document.createTextNode(vanhaSkripti.innerHTML));
                    
                    // Vaihdetaan vanha skripti uuteen, jolloin selaimen on suoritettava se
                    vanhaSkripti.parentNode.replaceChild(uusiSkripti, vanhaSkripti);
                });

            } catch {
                alue.innerHTML = `<h2>Virhe</h2><p>Sivua ei voitu ladata.</p>`;
            }
        }
    </script>
    </script>
</body>
</html>

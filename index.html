<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Combo Matrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --raise-color: rgb(231, 153, 123);
            --call-color: rgb(143, 191, 139);
            --fold-color: rgb(111, 161, 193);
            --clear-color: rgb(102, 102, 102);
            --allin-color: rgb(251, 73, 43);
            --bg-color: #f0f0f0;
            --bg-sidebar: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: flex-start;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            user-select: none;
            min-height: 100vh;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: var(--bg-sidebar);
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #ddd;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header span {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .range-select {
            width: 100%;
            padding: 6px 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            color: #333;
            outline: none;
            cursor: pointer;
        }

        .range-select:focus {
            border-color: #007bff;
        }

        .sidebar-section {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: bold;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .preset-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #fdfdfd;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: all 0.15s ease;
        }

        .preset-btn:hover {
            background: #eef4ff;
            border-color: #007bff;
            color: #007bff;
        }

        .preset-btn.active {
            border-color: #007bff;
            background: #007bff;
            color: #fff;
        }

        .main-content {
            padding: 15px;
            flex-grow: 1;
        }

        .palette-panel {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 1400px;
        }

        .palette-btn {
            height: 30px;
            border: 1px solid #333;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            background: white;
        }

        .palette-btn.active {
            outline: 3px solid #007bff;
            z-index: 10;
        }

        .main-container {
            display: flex;
            gap: 15px;
            max-width: 1400px;
            width: 100%;
        }



        .matrix-panel {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            gap: 1px;
            background: #444;
            border: 2px solid #222;
        }

        .matrix-cell {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
        }

        .matrix-cell:hover {
            outline: 2px solid darkred;
            transform: scale(1.105);
        }

        .detail-panel {
            width: 320px;
            background: #fff;
            border: 1px solid #999;
            padding: 12px;
            height: 585px;
            overflow-y: auto;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            user-select: text; 
        }

        .bulk-section {
            background: #f9f9f9;
            padding: 8px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
            border-radius: 4px;
        }

        .bulk-title {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #666;
            text-transform: uppercase;
        }

        .combo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 13px;
        }

        .combo-actions {
            display: flex;
            gap: 3px;
        }

        .action-dot {
            width: 18px;
            height: 18px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-radius: 3px;
        }

        .action-dot.active {
            outline: 2px solid #000;
            outline-offset: 1px;
        }

        .suit-s {
            color: #000;
        }

        .suit-c {
            color: #1a7a1a;
        }

        .suit-h {
            color: #d10000;
        }

        .suit-d {
            color: #0051ff;
        }

        .bottom-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            width: 100%;
            max-width: 1200px;
            gap: 8px;
            margin-top: 15px;
        }

        .stat-box {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #333;
            cursor: pointer;
            color: black;
        }

        .tooltip {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #333;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }

        .note-panel {
            width: 520px;
            background: #fff;
            border: 1px solid #999;
            padding: 12px;
            height: 585px;
            overflow-y: auto;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            font-size: 13px;
            color: #333;
            line-height: 1.4;
            user-select: text; 
        }

        .note-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span>Range Manager</span>
            <select class="range-select" id="rangeSelect" onchange="switchRange(this.value)"></select>
        </div>

        <div class="positions-container" id="sidebarContent"></div>
    </div>

    <div class="main-content">
        <div class="tooltip" id="toast">Copied!</div>

        <div class="palette-panel" id="palettePanel"></div>

        <div class="main-container">
            <div class="matrix-panel" id="matrixPanel"></div>
            <div class="detail-panel">
                <h3 id="detailTitle" style="margin:0 0 8px 0; font-size: 16px;">Details</h3>
                <div id="bulkContainer" class="bulk-section"></div>
                <div id="comboContainer"></div>
            </div>
            <div class="note-panel" id="notePanel">
                <div class="note-title">Notes</div>
                <div id="noteContent" style="white-space: pre-line; color: #666;">No preset selected.</div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="stat-box" id="raiseStat" onclick="copyAction(COLORS.RAISE, 'Raise')"></div>
            <div class="stat-box" id="callStat" onclick="copyAction(COLORS.CALL, 'Call')"></div>
            <div class="stat-box" id="foldStat" onclick="copyAction(COLORS.FOLD, 'Fold')"></div>
            <div class="stat-box" id="allinStat" onclick="copyAction(COLORS.ALLIN, 'All-In')"></div>
        </div>

        <div
            style="margin-top: 15px; font-size: 14px; font-weight: bold; display: flex; flex-direction: column; gap: 6px;">
            <label style="cursor: pointer; user-select: none;">
                <input type="checkbox" id="hideFoldCheckbox" onchange="updateAllVisuals()"> Hide Fold Range
            </label>
            <label style="cursor: pointer; user-select: none;">
                <input type="checkbox" id="convertToGlobalCheckbox"> Convert to Global Frequencies
            </label>
        </div>
    </div>

        let currentRangeKey = Object.keys(RANGE_SETS)[0];

        function init() {
            initRangeDropdown();
            createSidebarPresets();
            createPalette();
            createMatrix();
            updateStats();
            window.addEventListener('mouseup', () => isDragging = false);
        }

        function initRangeDropdown() {
            const select = document.getElementById('rangeSelect');
            select.innerHTML = '';
            Object.keys(RANGE_SETS).forEach(key => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.innerText = key;
                select.appendChild(opt);
            });
        }

        function switchRange(rangeKey) {
            currentRangeKey = rangeKey;
            PRESETS = RANGE_SETS[rangeKey] || [];
            createSidebarPresets();

            gridState.forEach(state => {
                Object.keys(state.handMap).forEach(combo => {
                    state.handMap[combo] = createEmptyFreq();
                });
                updateCellVisual(state);
            });
            updateStats();

            const noteEl = document.getElementById('noteContent');
            if (noteEl) {
                noteEl.innerText = 'No preset selected.';
                noteEl.style.color = '#666';
            }
        }

        function createSidebarPresets() {
            const container = document.getElementById('sidebarContent');
            container.innerHTML = '';

            const categories = {};
            PRESETS.forEach(p => {
                const cat = p.category || 'General';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push(p);
            });

            Object.entries(categories).forEach(([catName, presets]) => {
                const section = document.createElement('div');
                section.className = 'sidebar-section';

                const title = document.createElement('div');
                title.className = 'sidebar-section-title';
                title.innerText = catName;
                section.appendChild(title);

                presets.forEach(preset => {
                    const btn = document.createElement('button');
                    btn.className = 'preset-btn';

                    const raisePct = getRaisePercentage(preset);
                    btn.innerHTML = `<span>${preset.name}</span> <span class="preset-tag">(${raisePct})</span>`;
                    btn.onclick = () => {
                        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        applyPreset(preset);
                    };
                    section.appendChild(btn);
                });

                container.appendChild(section);
            });
        }

        function getRaisePercentage(preset) {
            const raiseActions = preset.actions[COLORS.RAISE];
            if (!raiseActions) return '0.0%';

            const handsStr = Array.isArray(raiseActions) ? raiseActions[0] : raiseActions;
            let comboWeight = 0;

            // Parse 169-number space-separated array format
            if (typeof handsStr === 'string') {
                const parts = handsStr.trim().split(/\s+/);
                if (parts.length === 169 && !parts.some(isNaN)) {
                    parts.forEach((val, idx) => {
                        const weight = parseFloat(val);
                        if (weight > 0) {
                            const r = Math.floor(idx / 13);
                            const c = idx % 13;
                            const factor = (r === c) ? 6 : (r < c ? 4 : 12);
                            comboWeight += factor * weight;
                        }
                    });
                    return `${((comboWeight / 1326) * 100).toFixed(1)}%`;
                }
            }

            // Fallback for standard combo string parsing
            parseActionItems(raiseActions).forEach(({ hand, pct }) => {
                const factor = hand.length === 4 ? 1 : hand.length === 2 ? 6 : hand.endsWith('s') ? 4 : hand.endsWith('o') ? 12 : 0;
                comboWeight += factor * (pct / 100);
            });

            return `${((comboWeight / 1326) * 100).toFixed(1)}%`;
        }

        function parseActionItems(hands) {
            const items = (Array.isArray(hands) ? hands : [hands])
                .flatMap(item => typeof item === 'string' ? item.split(',') : item)
                .map(h => String(h).trim())
                .filter(Boolean);
            return items.map(item => {
                const m = item.match(/^(.+?):\s*(0(?:\.\d+)?|1(?:\.0+)?)$/);
                return m ? { hand: m[1].trim(), pct: Number(m[2]) * 100 } : { hand: item, pct: 100 };
            });
        }

        function applyPreset(preset) {
            gridState.forEach(state => {
                Object.keys(state.handMap).forEach(combo => state.handMap[combo] = createEmptyFreq());
            });

            const comboToState = {};
            const labelToState = {};
            gridState.forEach(s => {
                labelToState[s.label] = s;
                Object.keys(s.handMap).forEach(k => comboToState[k] = s);
            });

            Object.entries(preset.actions).forEach(([color, hands]) => {
                if (!hands) return;

                const handsStr = Array.isArray(hands) ? hands[0] : hands;
                if (typeof handsStr === 'string') {
                    // Replace commas with spaces, split by any whitespace, and filter out empties
                    const parts = handsStr.replace(/,/g, ' ').trim().split(/\s+/).filter(p => p !== '');
                    const numericParts = parts.filter(p => !isNaN(p));

                    // Check if it has at least 169 numbers
                    if (numericParts.length >= 169) {
                        numericParts.slice(0, 169).forEach((val, idx) => {
                            const pct = Number((parseFloat(val) * 100).toFixed(2));
                            if (pct > 0) {
                                const r = Math.floor(idx / 13);
                                const c = idx % 13;
                                const label = (r < c) ? cards[r] + cards[c] + 's' : (r > c ? cards[c] + cards[r] + 'o' : cards[r] + cards[r]);
                                const cellState = labelToState[label];
                                if (cellState) {
                                    Object.keys(cellState.handMap).forEach(combo => {
                                        cellState.handMap[combo][color] = pct;
                                    });
                                }
                            }
                        });
                        return; // Skip normal parsing for this color
                    }
                }

                // Normal comma-separated parsing fallback
                parseActionItems(hands).forEach(({ hand, pct }) => {
                    if (hand.length === 4) {
                        const cellState = comboToState[hand];
                        if (cellState) cellState.handMap[hand][color] = pct;
                    } else {
                        const cellState = labelToState[hand];
                        if (cellState) {
                            Object.keys(cellState.handMap).forEach(combo => {
                                cellState.handMap[combo][color] = pct;
                            });
                        }
                    }
                });
            });

            // Run a normalization pass to correct CLEAR and handle any overflow
            gridState.forEach(state => {
                Object.keys(state.handMap).forEach(combo => {
                    const freq = state.handMap[combo];
                    const actionTotal = [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN]
                        .reduce((sum, k) => sum + (freq[k] || 0), 0);

                    if (actionTotal > 100) {
                        const scale = 100 / actionTotal;
                        [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN].forEach(k => freq[k] *= scale);
                        freq[COLORS.CLEAR] = 0;
                    } else {
                        freq[COLORS.CLEAR] = 100 - actionTotal;
                    }
                });
                updateCellVisual(state);
            });

            updateStats();
            if (selectedCell) selectCell(selectedCell);
            const noteEl = document.getElementById('noteContent');
            if (noteEl) {
                noteEl.innerText = preset.note || 'No notes available for this preset.';
                noteEl.style.color = preset.note ? '#333' : '#888';
            }
        }

        function createPalette() {
            const container = document.getElementById('palettePanel');
            PALETTES.forEach((p, i) => {
                const btn = document.createElement('div');
                btn.className = 'palette-btn' + (i === 0 ? ' active' : '');
                btn.innerText = p.n;

                if (!p.c) {
                    btn.style.background = '#fff';
                } else if (p.c.length === 1) {
                    btn.style.background = p.c[0];
                } else {
                    const stops = [];
                    const step = 100 / p.c.length;

                    p.c.forEach((color, index) => {
                        const start = index * step;
                        const end = (index + 1) * step;
                        stops.push(`${color} ${start}%`, `${color} ${end}%`);
                    });

                    btn.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
                }

                btn.onclick = () => {
                    currentBrush = p.c;
                    document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                container.appendChild(btn);
            });
        }

        function createMatrix() {
            const container = document.getElementById('matrixPanel');
            for (let r = 0; r < 13; r++) {
                for (let c = 0; c < 13; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'matrix-cell';
                    const label = (r < c) ? cards[r] + cards[c] + 's' : (r > c ? cards[c] + cards[r] + 'o' : cards[r] + cards[r]);
                    cell.innerText = label;
                    const state = { label, handMap: generateHandMap(r, c), dom: cell };
                    cell.onmousedown = () => { isDragging = true; paintCell(state); selectCell(state); };
                    cell.onmouseenter = () => { if (isDragging) paintCell(state); };
                    updateCellVisual(state);
                    container.appendChild(cell);
                    gridState.push(state);
                }
            }
        }

        function generateHandMap(r, c) {
            const map = {};
            const r1 = cards[r], r2 = cards[c];
            if (r === c) {
                for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) map[`${r1}${suits[i]}${r2}${suits[j]}`] = createEmptyFreq();
            } else if (c > r) {
                suits.forEach(s => map[`${r1}${s}${r2}${s}`] = createEmptyFreq());
            } else {
                suits.forEach(s1 => suits.forEach(s2 => { if (s1 !== s2) map[`${r2}${s1}${r1}${s2}`] = createEmptyFreq(); }));
            }
            return map;
        }

        function createEmptyFreq() {
            return {
                [COLORS.RAISE]: 0,
                [COLORS.CALL]: 0,
                [COLORS.FOLD]: 0,
                [COLORS.ALLIN]: 0,
                [COLORS.CLEAR]: 100
            };
        }

        function normalizeFreq(freq) {
            const out = createEmptyFreq();
            const source = freq || {};

            [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN].forEach(k => {
                out[k] = Math.max(0, Math.min(100, Number(source[k]) || 0));
            });

            const actionTotal = [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN]
                .reduce((sum, k) => sum + out[k], 0);

            if (actionTotal > 100) {
                const scale = 100 / actionTotal;
                [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN]
                    .forEach(k => out[k] *= scale);
                out[COLORS.CLEAR] = 0;
            } else {
                out[COLORS.CLEAR] = 100 - actionTotal;
            }

            return out;
        }

        function setComboAction(state, combo, color, percentage = 100) {
            const freq = normalizeFreq(state.handMap[combo]);
            const pct = Math.max(0, Math.min(100, Number(percentage) || 0));

            if (color === COLORS.CLEAR) {
                state.handMap[combo] = createEmptyFreq();
                return;
            }

            freq[color] = pct;

            // Keep the combo at exactly 100% total. The remaining frequency is
            // distributed proportionally across the other actions; if there are
            // none, it becomes Clear.
            const others = [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN]
                .filter(k => k !== color);
            const otherTotal = others.reduce((sum, k) => sum + (Number(freq[k]) || 0), 0);

            if (otherTotal > 0) {
                const scale = Math.max(0, 100 - pct) / otherTotal;
                others.forEach(k => freq[k] *= scale);
            } else {
                others.forEach(k => freq[k] = 0);
            }

            freq[COLORS.CLEAR] = Math.max(0, 100 -
                [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN]
                    .reduce((sum, k) => sum + freq[k], 0));

            state.handMap[combo] = freq;
        }

        function paintCell(state) {
            if (!currentBrush) return;
            const keys = Object.keys(state.handMap);
            keys.forEach((k, i) => {
                const color = currentBrush[Math.floor((i / keys.length) * currentBrush.length)];
                const freq = createEmptyFreq();
                if (color) {
                    freq[COLORS.CLEAR] = 0;
                    freq[color] = 100;
                }
                state.handMap[k] = freq;
            });
            updateCellVisual(state);
            updateStats();
            if (selectedCell === state) selectCell(state);
        }

        function updateCellVisual(state) {
            const hideFold = document.getElementById('hideFoldCheckbox')?.checked;
            const combos = Object.values(state.handMap);
            const actions = [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN, COLORS.CLEAR];

            const aggregatedFreqs = {
                [COLORS.RAISE]: 0,
                [COLORS.CALL]: 0,
                [COLORS.FOLD]: 0,
                [COLORS.ALLIN]: 0,
                [COLORS.CLEAR]: 0
            };

            combos.forEach(rawFreq => {
                const freq = normalizeFreq(rawFreq);
                actions.forEach(color => {
                    aggregatedFreqs[color] += Number(freq[color]) || 0;
                });
            });

            const comboCount = combos.length || 1;
            let pos = 0;
            const stops = [];

            actions.forEach(color => {
                const avgPct = aggregatedFreqs[color] / comboCount;
                if (avgPct > 0) {
                    const end = pos + avgPct;

                    // Jos fold on piilotettu, näytetään se läpinäkyvänä tyhjänä tilana
                    if (hideFold && color === COLORS.FOLD) {
                        stops.push(`transparent ${pos.toFixed(2)}%`);
                        stops.push(`transparent ${end.toFixed(2)}%`);
                    } else {
                        stops.push(`${color} ${pos.toFixed(2)}%`);
                        stops.push(`${color} ${end.toFixed(2)}%`);
                    }

                    pos = end;
                }
            });

            // Varmistetaan että gradientti kattaa tarvittaessa koko alueen
            if (pos < 100) {
                stops.push(`transparent ${pos.toFixed(2)}%`);
                stops.push(`transparent 100.00%`);
            }

            state.dom.style.background = stops.length
                ? `linear-gradient(to right, ${stops.join(', ')})`
                : COLORS.CLEAR;
        }
        function formatSuit(hand) {
            const symbol = { s: '♠', c: '♣', h: '♥', d: '♦' };
            return hand.replace(/([schd])/g, (m) => `<span class="suit-${m}">${symbol[m]}</span>`);
        }

        function formatPct(value) {
            return Number(value || 0).toFixed(0);
        }

        function selectCell(state) {
            selectedCell = state;
            document.getElementById('detailTitle').innerText = state.label;
            const bulk = document.getElementById('bulkContainer');
            bulk.innerHTML = '<div class="bulk-title">Bulk Apply</div>';
            const bulkActions = document.createElement('div');
            bulkActions.className = 'combo-actions';
            [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN, COLORS.CLEAR].forEach(color => {
                const btn = document.createElement('div');
                btn.className = 'action-dot';
                btn.style.backgroundColor = color;
                btn.title = color === COLORS.CLEAR ? 'Clear' : 'Set 100%';
                btn.onclick = () => {
                    Object.keys(state.handMap).forEach(k => {
                        const freq = createEmptyFreq();
                        if (color !== COLORS.CLEAR) {
                            freq[COLORS.CLEAR] = 0;
                            freq[color] = 100;
                        }
                        state.handMap[k] = freq;
                    });
                    updateCellVisual(state); updateStats(); selectCell(state);
                };
                bulkActions.appendChild(btn);
            });
            bulk.appendChild(bulkActions);

            const container = document.getElementById('comboContainer');
            container.innerHTML = '';

            const hideFold = document.getElementById('hideFoldCheckbox')?.checked;
            const actions = [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN, COLORS.CLEAR];

            Object.entries(state.handMap).forEach(([name, rawFreq]) => {
                const freq = normalizeFreq(rawFreq);
                state.handMap[name] = freq;
                const row = document.createElement('div');
                row.className = 'combo-row';

                // Rakennetaan kombolle monivärinen gradientti-tausta prosenttien mukaan
                let totalWeight = 0;
                actions.forEach(color => {
                    let pct = Number(freq[color]) || 0;
                    if (hideFold && color === COLORS.FOLD) pct = 0;
                    totalWeight += pct;
                });

                const stops = [];
                let pos = 0;
                if (totalWeight > 0) {
                    actions.forEach(color => {
                        let pct = Number(freq[color]) || 0;
                        if (hideFold && color === COLORS.FOLD) pct = 0;

                        if (pct > 0) {
                            const end = pos + pct;
                            if (hideFold && color === COLORS.FOLD) {
                                stops.push(`transparent ${pos.toFixed(2)}%`);
                                stops.push(`transparent ${end.toFixed(2)}%`);
                            } else {
                                stops.push(`${color} ${pos.toFixed(2)}%`);
                                stops.push(`${color} ${end.toFixed(2)}%`);
                            }
                            pos = end;
                        }
                    });
                }
                if (pos < 100) {
                    stops.push(`transparent ${pos.toFixed(2)}%`);
                    stops.push(`transparent 100.00%`);
                }

                row.style.background = stops.length ? `linear-gradient(to right, ${stops.join(', ')})` : COLORS.CLEAR;
                row.style.borderRadius = '4px';
                row.style.marginBottom = '2px';
                row.style.color = '#fff';
                row.style.textShadow = '1px 1px 1px #000';
                row.innerHTML = `<span style="font-weight:bold; padding-left:5px;">${formatSuit(name)}</span>`;

                const actionGroup = document.createElement('div');
                actionGroup.className = 'combo-actions';
                actionGroup.style.paddingRight = '5px';
                [COLORS.RAISE, COLORS.CALL, COLORS.FOLD, COLORS.ALLIN, COLORS.CLEAR].forEach(color => {
                    const dot = document.createElement('div');
                    const active = (freq[color] || 0) > 0;
                    dot.className = `action-dot ${active ? 'active' : ''}`;
                    dot.style.backgroundColor = color;
                    dot.title = `${name} – ${color === COLORS.CLEAR ? 'Clear' : 'Set percentage'}`;
                    dot.onclick = () => {
                        if (color === COLORS.CLEAR) {
                            state.handMap[name] = createEmptyFreq();
                            updateCellVisual(state); updateStats(); selectCell(state);
                            return;
                        }
                        const current = formatPct(freq[color]);
                        const answer = prompt(`${name} ${color === COLORS.RAISE ? 'Raise' : color === COLORS.CALL ? 'Call' : color === COLORS.FOLD ? 'Fold' : 'All-In'} frequency (0–1)`, (Number(current) / 100).toFixed(2));
                        if (answer === null) return;
                        const frequency = Number(answer);
                        if (!Number.isFinite(frequency) || frequency < 0 || frequency > 1) return;
                        setComboAction(state, name, color, frequency * 100);
                        updateCellVisual(state); updateStats(); selectCell(state);
                    };
                    actionGroup.appendChild(dot);
                });
                row.appendChild(actionGroup);
                container.appendChild(row);
            });
        }

        function updateAllVisuals() {
            gridState.forEach(state => updateCellVisual(state));
        }

        function updateStats() {
            const counts = { [COLORS.RAISE]: 0, [COLORS.CALL]: 0, [COLORS.FOLD]: 0, [COLORS.ALLIN]: 0 };
            gridState.forEach(s => Object.values(s.handMap).forEach(freq => {
                const f = normalizeFreq(freq);
                Object.keys(counts).forEach(color => counts[color] += f[color] || 0.0);
            }));
            const set = (id, color, name) => {
                const el = document.getElementById(id);
                el.style.backgroundColor = color;
                el.innerText = `${name}: ${((counts[color] / 1326)).toFixed(1)}% (${(counts[color] / 100.0).toFixed(1)})`;
            };
            set('raiseStat', COLORS.RAISE, 'Raise');
            set('callStat', COLORS.CALL, 'Call');
            set('foldStat', COLORS.FOLD, 'Fold');
            set('allinStat', COLORS.ALLIN, 'All-In');
        }

        function copyAction(color, name) {
            const isGlobal = document.getElementById('convertToGlobalCheckbox')?.checked;
            const handWeights = [];
            gridState.forEach(state => {
                const combos = Object.entries(state.handMap);
                if (isGlobal) {
                    const total = combos.reduce((sum, [, freq]) => sum + (normalizeFreq(freq)[color] || 0), 0);
                    if (total > 0) handWeights.push(`${state.label}:${(total / combos.length / 100).toFixed(2)}`);
                } else {
                    combos.forEach(([combo, freq]) => {
                        const pct = normalizeFreq(freq)[color] || 0;
                        if (pct > 0) handWeights.push(`${combo}:${(pct / 100).toFixed(4).replace(/0+$/, '').replace(/\.$/, '')}`);
                    });
                }
            });
            const copyText = handWeights.join(',') || 'None';
            navigator.clipboard.writeText(copyText);
            const t = document.getElementById('toast');
            t.innerText = `Copied ${name}`; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 1000);
        }

        init();
    </script>
